<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Banco de Dados de um MMO inspirado em RuneScape">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1F22"/><stop offset="1" stop-color="#050B0C"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55"><stop offset="0" stop-color="#79F016" stop-opacity="0.22"/><stop offset="1" stop-color="#79F016" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#79F016" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="1280" height="380" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="14" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="379" rx="14" fill="none" stroke="#79F016" stroke-opacity="0.25"/>
  <!-- tab bar -->
  <rect x="0" y="0" width="1280" height="38" rx="14" fill="#0A1517"/><rect x="0" y="20" width="1280" height="18" fill="#0A1517"/>
  <rect x="24" y="0" width="150" height="38" fill="#0E1F22"/><rect x="24" y="36" width="150" height="2" fill="#79F016"/>
  <text x="44" y="24" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13" fill="#79F016">Console.log</text>
  <text x="196" y="24" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13" fill="#547165">schema.mmo</text>
  <text x="300" y="24" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13" fill="#547165">testes.sql</text>
  <!-- boot lines -->
  <g font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#79F016">
    <text x="56" y="86" fill="#547165">LOAD schema    // mmo</text>
    <text x="56" y="108" fill="#547165">LOAD sgbd      // postgresql_16</text>
    <text x="56" y="130" fill="#547165">LOAD regras    // dentro_do_banco</text>
  </g>
  <!-- title -->
  <text x="56" y="205" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="300" fill="#E8ECEA">Banco de Dados de um <tspan fill="#79F016" font-weight="500">MMO</tspan></text>
  <text x="56" y="256" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="300" fill="#A7B7AD">inspirado em RuneScape. Simples de explicar, rigoroso nas regras.</text>
  <!-- progress -->
  <g font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="15">
    <text x="56" y="318" fill="#79F016">[</text>
    <rect x="72" y="305" width="260" height="14" fill="#79F016"/>
    <text x="340" y="318" fill="#79F016">] 61/61 testes</text>
    <text x="500" y="318" fill="#547165">Exit Code 0</text>
  </g>
  <!-- tags -->
  <g font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="1.5">
    <rect x="56" y="338" width="230" height="26" rx="4" fill="#79F016"/><text x="70" y="356" fill="#050B0C" font-weight="700">AV3 · BANCO DE DADOS</text>
    <rect x="298" y="338" width="190" height="26" rx="4" fill="none" stroke="#79F016" stroke-opacity="0.6"/><text x="312" y="356" fill="#79F016">UNIFAMETRO 2026</text>
  </g>
  <!-- pixel art decoration: tabelas ligadas -->
  <g transform="translate(900,80)" stroke="#79F016" stroke-opacity="0.55" fill="none">
    <path d="M70 60 L200 30 M200 30 L300 110 M70 60 L120 170 M120 170 L240 200 M300 110 L240 200 M200 30 L240 200" stroke-dasharray="4 5"/>
    <g fill="#0E1F22" stroke-opacity="0.9">
      <rect x="20" y="40" width="100" height="44" rx="4"/><rect x="150" y="8" width="100" height="44" rx="4"/>
      <rect x="250" y="90" width="100" height="44" rx="4"/><rect x="70" y="150" width="100" height="44" rx="4"/>
      <rect x="190" y="180" width="100" height="44" rx="4"/>
    </g>
    <g font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13" fill="#79F016" stroke="none" text-anchor="middle">
      <text x="70" y="67">contas</text><text x="200" y="35">personagens</text><text x="300" y="117">inventario</text><text x="120" y="177">skills</text><text x="240" y="207">ge_ofertas</text>
    </g>
  </g>
</svg>
